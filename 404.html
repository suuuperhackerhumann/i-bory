<script src="js/main.js"></script>
<script>
(()=>{
/* Réglages : numéro WhatsApp (format international sans +) et adresse de réception */
const WA='2250788736040',MAILS='Iboryci@gmail.com';
const f=document.getElementById('contact-form'),hint=f.querySelector('.hint');
const compose=()=>{const d=Object.fromEntries(new FormData(f));
return{subject:`Demande via le site i-bory : ${d.sujet}`,body:`Bonjour i-bory,\n\nJe m'appelle ${d.nom.trim()} (${d.email.trim()}).\nSujet : ${d.sujet}\n\n${d.message.trim()}`}};
const valid=()=>{f.querySelectorAll('input,select,textarea').forEach(el=>el.dispatchEvent(new Event('blur')));
const bad=f.querySelector('.f.bad input,.f.bad select,.f.bad textarea');if(bad){bad.focus();hint.textContent='';return false}return true};
f.querySelectorAll('[data-channel]').forEach(b=>b.addEventListener('click',()=>{
if(!valid())return;const m=compose();
if(b.dataset.channel==='wa'){window.open(`https://wa.me/${WA}?text=${encodeURIComponent(m.body)}`,'_blank','noopener');hint.textContent="WhatsApp s'ouvre avec votre message prêt : appuyez sur Envoyer."}
else{location.href=`mailto:${MAILS}?subject=${encodeURIComponent(m.subject)}&body=${encodeURIComponent(m.body)}`;hint.textContent="Votre application de messagerie s'ouvre avec le message prêt."}}));
})();
</script></body></html>
